<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Who Am I?</title><script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#101936,#293b76);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:white}
main{width:min(680px,100%);margin:auto;padding:18px}.card{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:26px;padding:20px;box-shadow:0 18px 50px #0005}
h1{font-size:38px;margin:0 0 5px}.sub{opacity:.78;margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:600px){.grid{grid-template-columns:1fr}}
input,select,button{width:100%;font-size:18px;border-radius:16px;padding:16px;margin:6px 0;border:0}input,select{background:white;color:#111}button{font-weight:800;background:#6ee7b7;color:#07130e;min-height:56px}.secondary{background:#a5b4fc}.danger{background:#fb7185}.hidden{display:none}.code{font-size:42px;letter-spacing:8px;font-weight:900;text-align:center;background:#0a1129;border-radius:18px;padding:16px;margin:10px 0}.players{display:flex;flex-wrap:wrap;gap:8px}.pill{padding:9px 12px;background:#344477;border-radius:99px}.turn{outline:3px solid #6ee7b7}.word{font-size:32px;font-weight:900;text-align:center;padding:42px 12px;border-radius:20px;background:#0a1129;margin:12px 0}.category{font-size:21px;text-align:center}.error{color:#fecaca;font-weight:700;min-height:24px}.small{opacity:.72;font-size:13px}.row{display:flex;gap:10px}.row>*{flex:1}.panel{margin-top:18px;padding-top:18px;border-top:1px solid #ffffff22}
</style></head><body><main><div class="card">
<h1>🎭 Who Am I?</h1><div class="sub">Multiplayer • phone friendly</div>
<section id="home"><div class="grid"><div><h2>Host</h2><input id="hn" placeholder="Your name" autocomplete="name"><button onclick="create()">Create game</button></div><div><h2>Join</h2><input id="jn" placeholder="Your name" autocomplete="name"><input id="jc" placeholder="Game code" maxlength="6" autocapitalize="characters"><button class="secondary" onclick="join()">Join game</button></div></div><div id="err" class="error"></div></section>
<section id="game" class="hidden"><div class="code" id="code"></div><div class="small" style="text-align:center">Share this code with the other players.</div>
<h2>Players</h2><div id="players" class="players"></div>
<div id="host" class="panel hidden"><h2>Host controls</h2><input id="word" placeholder="Word or phrase"><input id="cat" placeholder="Category — e.g. Animal, Movie, Food"><select id="dir"><option value="right">➡️ Move to the right</option><option value="left">⬅️ Move to the left</option></select><button onclick="start()">Start round</button><div class="row"><button class="secondary" onclick="next()">Next turn</button><button class="danger" onclick="reset()">Reset</button></div></div>
<div class="panel"><h2>Your clue</h2><div class="category">Category: <b id="mycat">—</b></div><div class="word" id="myword">Waiting for the host…</div><div id="turn" class="small"></div></div>
</section></div></main>
<script>
const s=io(),$=x=>document.getElementById(x);function showErr(x){$("err").textContent=x}
function create(){showErr("");s.emit("create",{name:$("hn").value})}function join(){showErr("");s.emit("join",{name:$("jn").value,code:$("jc").value})}
s.on("err",showErr);s.on("closed",()=>{alert("The host ended the game.");location.reload()});
s.on("state",g=>{$("home").classList.add("hidden");$("game").classList.remove("hidden");$("code").textContent=g.code;$("host").classList.toggle("hidden",g.hostId!==s.id);$("players").innerHTML=g.players.map((p,i)=>`<span class="pill ${g.started&&i===g.currentTurn?"turn":""}">${g.started&&i===g.currentTurn?"🎯 ":""}${esc(p.name)}</span>`).join("");$("turn").textContent=g.started?"Current turn: "+(g.players[g.currentTurn]?.name||""):"Waiting for the host to start…"});
s.on("private",p=>{$("mycat").textContent=p.category||"—";$("myword").textContent=p.word||"Waiting for the host to deal the word…"});
function start(){s.emit("start",{word:$("word").value,category:$("cat").value,direction:$("dir").value})}function next(){s.emit("next")}function reset(){s.emit("reset")}function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
</script></body></html>
